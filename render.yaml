# Render blueprint. Create the service from this file, then set the secret
# environment variables in the dashboard (they are deliberately not in git).
services:
  - type: web
    name: flotilla
    runtime: docker
    dockerfilePath: ./Dockerfile

    # Free works because state lives in Postgres, not on local disk. Note that a
    # free service sleeps when idle, so the first request after a quiet period
    # takes roughly a minute. Move to a paid instance to remove that.
    plan: free

    # Pick a region before the first deploy - it cannot be changed afterwards.
    # Match the region of the database you are sharing, or every query pays a
    # cross-region round trip.
    region: oregon

    healthCheckPath: /healthz
    autoDeploy: false

    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SECURE_COOKIES
        value: "1"

      # Own schema, because this app's `users` and `sessions` tables would
      # otherwise collide with whatever else uses the database.
      - key: DATABASE_SCHEMA
        value: public
      # Render's internal database URLs do not use TLS.
      - key: DATABASE_SSL
        value: "0"
      - key: DATABASE_POOL_MAX
        value: "5"

      # --- set these in the Render dashboard, never in git -------------------
      # Internal Database URL of the Postgres instance you already run. Use the
      # internal URL when the service and database share a region.
      - key: DATABASE_URL
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Generate once and store it. Changing it makes every stored Google token
      # permanently unreadable and forces all users to reconnect:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      - key: ENCRYPTION_KEY
        sync: false
      # Must exactly match an Authorised redirect URI on the OAuth client:
      #   https://flotillahq.com/api/auth/callback
      - key: OAUTH_REDIRECT_URI
        sync: false
